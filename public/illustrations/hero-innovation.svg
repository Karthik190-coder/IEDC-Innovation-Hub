<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" fill="none" aria-hidden="true" role="img">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FB923C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#172554;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3A5F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FBBF24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F43F5E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FB7185;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E7E5E4;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#E7E5E4;stop-opacity:0.1" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#172554" flood-opacity="0.08"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Subtle background grid -->
  <rect width="600" height="700" fill="url(#bgGrid)" opacity="0.3"/>

  <!-- Floating particles -->
  <g opacity="0.15">
    <circle cx="45" cy="45" r="3" fill="#F97316"/>
    <circle cx="550" cy="85" r="2" fill="#0D9488"/>
    <circle cx="480" cy="45" r="2.5" fill="#8B5CF6"/>
    <circle cx="60" cy="580" r="2" fill="#F59E0B"/>
    <circle cx="540" cy="620" r="3" fill="#F43F5E"/>
    <circle cx="120" cy="600" r="2.5" fill="#0D9488"/>
  </g>

  <!-- Central concept: IDEA → BUILD → IMPACT flow -->
  <!-- Stage 1: IDEA (Lightbulb/Spark) -->
  <g transform="translate(80, 120)" filter="url(#softShadow)">
    <rect x="0" y="0" width="140" height="140" rx="24" fill="url(#violetGrad)" opacity="0.15"/>
    <rect x="0" y="0" width="140" height="140" rx="24" fill="url(#violetGrad)" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.3"/>
    <path d="M70 35 C70 25 60 15 50 15 C40 15 30 25 30 35 C30 45 40 52 50 52 C60 52 70 45 70 35 Z M70 35 L70 65 M55 65 L85 65 M55 65 L70 75 L85 65" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="70" cy="35" r="8" fill="#8B5CF6" opacity="0.2"/>
    <text x="70" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#172554">IDEA</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(220, 185)">
    <path d="M0 0 L40 0" stroke="#E7E5E4" stroke-width="2" stroke-dasharray="8 4" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="2s" repeatCount="indefinite"/>
    </path>
    <polygon points="40,0 32,-5 32,5" fill="#E7E5E4"/>
  </g>

  <!-- Stage 2: BUILD (Hammer/Code) -->
  <g transform="translate(280, 120)" filter="url(#softShadow)">
    <rect x="0" y="0" width="140" height="140" rx="24" fill="url(#orangeGrad)" opacity="0.15"/>
    <rect x="0" y="0" width="140" height="140" rx="24" fill="url(#orangeGrad)" stroke="#F97316" stroke-width="1.5" stroke-opacity="0.3"/>
    <g transform="translate(70, 45)">
      <rect x="-20" y="-15" width="40" height="30" rx="4" fill="#F97316" opacity="0.9"/>
      <rect x="-20" y="15" width="12" height="25" rx="2" fill="#172554"/>
      <rect x="8" y="15" width="12" height="25" rx="2" fill="#172554"/>
      <path d="M-10 -15 L-10 -30 M10 -15 L10 -30" stroke="#F97316" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="-22" r="3" fill="#F97316"/>
      <path d="M-25 -5 L-5 -5 M-25 5 L-5 5" stroke="#172554" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="70" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#172554">BUILD</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(420, 185)">
    <path d="M0 0 L40 0" stroke="#E7E5E4" stroke-width="2" stroke-dasharray="8 4" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="2s" repeatCount="indefinite"/>
    </path>
    <polygon points="40,0 32,-5 32,5" fill="#E7E5E4"/>
  </g>

  <!-- Stage 3: IMPACT (Rocket/Launch) -->
  <g transform="translate(480, 120)" filter="url(#softShadow)">
    <rect x="0" y="0" width="140" height="140" rx="24" fill="url(#tealGrad)" opacity="0.15"/>
    <rect x="0" y="0" width="140" height="140" rx="24" fill="url(#tealGrad)" stroke="#0D9488" stroke-width="1.5" stroke-opacity="0.3"/>
    <g transform="translate(70, 55)">
      <path d="M0 -35 L-10 -15 L-8 -15 L-8 15 L-4 15 L-4 25 L4 25 L4 15 L8 15 L8 -15 L10 -15 L0 -35 Z" fill="#0D9488"/>
      <path d="M-8 5 L8 5" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <path d="M-8 -5 L8 -5" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <ellipse cx="0" cy="-25" rx="8" ry="4" fill="#14B8A6" opacity="0.9"/>
      <path d="M-12 15 L-12 30 M12 15 L12 30" stroke="#0D9488" stroke-width="3" stroke-linecap="round">
        <animate attributeName="stroke-dashoffset" values="0;-10" dur="1.5s" repeatCount="indefinite"/>
      </path>
      <path d="M-6 15 L-6 25 M6 15 L6 25" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    </g>
    <text x="70" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#172554">IMPACT</text>
  </g>

  <!-- Connecting pathway dots -->
  <g opacity="0.4" fill="#F97316">
    <circle cx="210" cy="250" r="3"/>
    <circle cx="230" cy="270" r="2.5"/>
    <circle cx="250" cy="290" r="2"/>
    <circle cx="270" cy="310" r="1.5"/>
    <circle cx="290" cy="330" r="1"/>
  </g>

  <!-- Student/Project cards floating around -->
  <!-- Card 1 -->
  <g transform="translate(30, 300)" filter="url(#softShadow)">
    <rect x="0" y="0" width="160" height="100" rx="12" fill="white" stroke="#E7E5E4" stroke-width="1"/>
    <rect x="0" y="0" width="160" height="4" fill="#F97316"/>
    <text x="12" y="30" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#172554">FinSight</text>
    <text x="12" y="44" font-family="system-ui, sans-serif" font-size="8" fill="#F97316" font-weight="600">FinTech</text>
    <text x="12" y="62" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">AI finance assistant...</text>
    <text x="12" y="84" font-family="system-ui, sans-serif" font-size="8" fill="#94A3B8">👥 3  ♥ 68</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(420, 290)" filter="url(#softShadow)">
    <rect x="0" y="0" width="150" height="100" rx="12" fill="white" stroke="#E7E5E4" stroke-width="1"/>
    <rect x="0" y="0" width="150" height="4" fill="#0D9488"/>
    <text x="10" y="30" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#172554">MediConnect</text>
    <text x="10" y="44" font-family="system-ui, sans-serif" font-size="8" fill="#0D9488" font-weight="600">HealthTech</text>
    <text x="10" y="62" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">Telemedicine platform...</text>
    <text x="10" y="84" font-family="system-ui, sans-serif" font-size="8" fill="#94A3B8">👥 5  ♥ 53</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(120, 440)" filter="url(#softShadow)">
    <rect x="0" y="0" width="170" height="100" rx="12" fill="white" stroke="#E7E5E4" stroke-width="1"/>
    <rect x="0" y="0" width="170" height="4" fill="#8B5CF6"/>
    <text x="12" y="30" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#172554">NeuroLearn AI</text>
    <text x="12" y="44" font-family="system-ui, sans-serif" font-size="8" fill="#8B5CF6" font-weight="600">AI</text>
    <text x="12" y="62" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">Adaptive learning...</text>
    <text x="12" y="84" font-family="system-ui, sans-serif" font-size="8" fill="#94A3B8">👥 4  ♥ 49</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(350, 435)" filter="url(#softShadow)">
    <rect x="0" y="0" width="160" height="100" rx="12" fill="white" stroke="#E7E5E4" stroke-width="1"/>
    <rect x="0" y="0" width="160" height="4" fill="#10B981"/>
    <text x="12" y="30" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#172554">GreenCampus</text>
    <text x="12" y="44" font-family="system-ui, sans-serif" font-size="8" fill="#10B981" font-weight="600">Sustainability</text>
    <text x="12" y="62" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">Campus sustainability...</text>
    <text x="12" y="84" font-family="system-ui, sans-serif" font-size="8" fill="#94A3B8">👥 6  ♥ 39</text>
  g>

  <!-- Card 5 -->
  <g transform="translate(25, 580)" filter="url(#softShadow)">
    <rect x="0" y="0" width="150" height="100" rx="12" fill="white" stroke="#E7E5E4" stroke-width="1"/>
    <rect x="0" y="0" width="150" height="4" fill="#F59E0B"/>
    <text x="10" y="30" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#172554">EcoTrack IoT</text>
    <text x="10" y="44" font-family="system-ui, sans-serif" font-size="8" fill="#F59E0B" font-weight="600">IoT</text>
    <text x="10" y="62" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">Env monitoring...</text>
    <text x="10" y="84" font-family="system-ui, sans-serif" font-size="8" fill="#94A3B8">👥 4  ♥ 28</text>
  </g>

  <!-- Card 6 -->
  <g transform="translate(430, 575)" filter="url(#softShadow)">
    <rect x="0" y="0" width="150" height="100" rx="12" fill="white" stroke="#E7E5E4" stroke-width="1"/>
    <rect x="0" y="0" width="150" height="4" fill="#3B82F6"/>
    <text x="10" y="30" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#172554">EduBridge</text>
    <text x="10" y="44" font-family="system-ui, sans-serif" font-size="8" fill="#3B82F6" font-weight="600">EdTech</text>
    <text x="10" y="62" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">Peer learning...</text>
    <text x="10" y="84" font-family="system-ui, sans-serif" font-size="8" fill="#94A3B8">👥 3  ♥ 31</text>
  </g>

  <!-- Bottom tagline -->
  <text x="300" y="680" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748B" letter-spacing="0.5px">
    Every project started as just an idea.
  </text>
</svg>